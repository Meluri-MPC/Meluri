apiVersion: apps/v1
kind: Deployment
metadata:
  name: velumx-api
  labels:
    app: velumx-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: velumx-api
  template:
    metadata:
      labels:
        app: velumx-api
    spec:
      containers:
        - name: api
          image: velumx-api:latest
          ports:
            - containerPort: 4002
              protocol: TCP
          envFrom:
            - secretRef:
                name: velumx-secrets
            - configMapRef:
                name: velumx-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: velumx-api
spec:
  selector:
    app: velumx-api
  ports:
    - port: 80
      targetPort: 4002
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: velumx-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: velumx-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
