apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: velumx-staging

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: velumx-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"

  - target:
      kind: HorizontalPodAutoscaler
      name: velumx-api-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

  - target:
      kind: StatefulSet
      name: velumx-mpc
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
