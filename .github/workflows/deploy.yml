name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  build-api-image:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Build SDK
        working-directory: packages/sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/velumx-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mpc-image:
    name: Build MPC Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta-mpc
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/velumx-mpc
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push MPC image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/mpc
          push: true
          tags: ${{ steps.meta-mpc.outputs.tags }}
          labels: ${{ steps.meta-mpc.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/main'
    needs: [build-api-image, build-mpc-image]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://api.staging.velumx.xyz
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to staging
        run: |
          kubectl kustomize infra/k8s/overlays/staging | kubectl apply -f -
          kubectl rollout status deployment/velumx-api -n velumx-staging --timeout=5m

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployed to staging :rocket:\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    name: Deploy to Production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    needs: [build-api-image, build-mpc-image, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.velumx.xyz
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Canary deploy (10%)
        run: |
          kubectl kustomize infra/k8s/overlays/production | \
            sed 's/replicas: 3/replicas: 1/' | kubectl apply -f -
          kubectl rollout status deployment/velumx-api -n velumx-prod --timeout=3m
          echo "Canary at 10% — monitoring for 2 minutes..."
          sleep 120

      - name: Full deploy (100%)
        run: |
          kubectl kustomize infra/k8s/overlays/production | kubectl apply -f -
          kubectl rollout status deployment/velumx-api -n velumx-prod --timeout=5m

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/velumx-api -n velumx-prod
          echo "Rollback triggered — check logs for errors"

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployed to production :white_check_mark:\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
